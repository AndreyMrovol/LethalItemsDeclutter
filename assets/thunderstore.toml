[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "mrov"
name = "ItemDeclutter"
description = "Small utility to organize dropped items on the ship."
websiteUrl = "https://github.com/AndreyMrovol/LethalItemsDeclutter/"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
mrov-MrovLib = "0.2.11"

[build]
icon = "../icon.png"
readme = "../README.md"
outdir = "../ItemDeclutter/dist"

[[build.copy]]
source = "../ItemDeclutter/bin/Release/netstandard2.1/ItemDeclutter.dll"
target = "/"

[[build.copy]]
source = "../LICENSE.md"
target = "/"

[publish]
communities = [ "lethal-company", ]